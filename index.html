<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Papa Moon</title>
    <meta name="description" content="Official site of Papa Moon">
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Playwrite+GB+J+Guides&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;700;900&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg: #050505;
            --accent: #F57733;
            --text: #f0f0f0;
            --gray: #aaaaaa;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Montserrat', system-ui, sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.6;
        }
        
        /* Header */
        header {
            position: fixed;
            top: 0;
            width: 100%;
            background: rgba(5, 5, 5, 0.95);
            backdrop-filter: blur(10px);
            z-index: 1200;
            padding: 1rem 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .logo-header {
            font-family: 'Playwrite GB J Guides', cursive;
            font-size: 1.9rem;
            color: var(--accent);
            text-shadow: 0 0 15px var(--accent);
        }
        
        nav {
            display: flex;
            align-items: center;
            gap: 2rem;
        }
        
        nav a {
            color: var(--text);
            text-decoration: none;
            font-weight: 500;
            transition: color 0.3s;
        }
        
        nav a:hover {
            color: var(--accent);
        }
        
        .hamburger {
            display: none;
            font-size: 1.8rem;
            cursor: pointer;
            color: var(--text);
        }
        
        /* Mobile Menu */
        .mobile-menu {
            display: none;
            position: fixed;
            top: 70px;
            left: 0;
            width: 100%;
            background: #050505;
            padding: 2rem 0;
            text-align: center;
            flex-direction: column;
            gap: 1.5rem;
            border-top: 1px solid #333;
            z-index: 1100;
        }
        
        .mobile-menu.active {
            display: flex;
        }
        
        .mobile-menu a {
            color: var(--text);
            text-decoration: none;
            font-size: 1.2rem;
            font-weight: 500;
            padding: 0.6rem 0;
            transition: color 0.3s;
        }
        
        .mobile-menu a:hover {
            color: var(--accent);
        }
        
        /* Streaming Icons */
        .streaming-icons {
            margin-top: 2rem;
            display: flex;
            justify-content: center;
            gap: 2.5rem;
            flex-wrap: wrap;
        }
        
        .streaming-icons a {
            font-size: 2.9rem;
            color: var(--gray);
            transition: all 0.3s ease;
        }
        
        .streaming-icons a:hover {
            transform: scale(1.25);
        }
        
        /* Hero */
        .hero {
            height: 100vh;
            min-height: 700px;
            padding-top: 100px;
            background: linear-gradient(rgba(0, 0, 0, 0.75), rgba(0, 0, 0, 0.85)),
                url('images/Stary night.jpg') center/cover no-repeat;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
        }
        
        .hero-logo {
            max-width: 520px;
            width: 85%;
            height: auto;
            filter: drop-shadow(0 15px 40px rgba(245, 119, 51, 0.5));
            transition: transform 0.6s ease;
            background: transparent !important;
        }
        
        .hero-logo:hover {
            transform: scale(1.03);
        }
        
        .tagline {
            font-size: 1.5rem;
            color: var(--gray);
            margin-top: 1.5rem;
            margin-bottom: 1.5rem;
        }
        
        .btn {
            display: inline-block;
            background: var(--accent);
            color: white;
            padding: 1rem 2.8rem;
            border-radius: 50px;
            text-decoration: none;
            font-weight: 700;
            font-size: 1.1rem;
            transition: all 0.4s ease;
        }
        
        .btn:hover {
            transform: scale(1.05);
            background: #ff8f4d;
        }
        
        /* Sections */
        section {
            padding: 100px 5%;
        }
        
        #music {
            margin-top: 80px;
        }
        
        .section-title {
            font-size: 2.8rem;
            text-align: center;
            margin-bottom: 3rem;
            color: var(--accent);
        }
        
        /* Release Grid */
        .release-grid {
            max-width: 900px;
            margin: 0 auto;
            text-align: center;
        }
        
        /* Contact Form */
        .contact-form {
            max-width: 700px;
            margin: 0 auto;
            background: #111;
            padding: 3.5rem 2.5rem;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
        }
        
        .contact-form input,
        .contact-form textarea {
            width: 100%;
            padding: 1.1rem 1.3rem;
            margin-bottom: 1.6rem;
            background: #1a1a1a;
            border: 1px solid #333;
            border-radius: 8px;
            color: white;
            font-family: 'Montserrat', sans-serif;
            font-size: 1rem;
            transition: all 0.3s;
        }
        
        .contact-form input:focus,
        .contact-form textarea:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(245, 119, 51, 0.2);
        }
        
        .contact-form textarea {
            resize: vertical;
            min-height: 140px;
        }
        
        footer {
            text-align: center;
            padding: 3rem;
            background: #000;
            color: var(--gray);
            font-size: 0.95rem;
        }
        
        /* Mobile */
        @media (max-width: 768px) {
            nav {
                display: none;
            }
            
            .hamburger {
                display: block;
            }
            
            .hero-logo {
                max-width: 380px;
            }
            
            .contact-form {
                padding: 2.5rem 1.5rem;
            }
            
            .section-title {
                font-size: 2.2rem;
            }
        }
    </style>
</head>
<body>
    <header>
        <div class="logo-header">PAPA MOON</div>
        <nav>
            <a href="#music">Music</a>
            <a href="#videos">Videos</a>
            <a href="#connect">Connect</a>
        </nav>
        <div class="hamburger" onclick="toggleMenu()">☰</div>
    </header>

    <div class="mobile-menu" id="mobileMenu">
        <a href="#music" onclick="toggleMenu()">Music</a>
        <a href="#videos" onclick="toggleMenu()">Videos</a>
        <a href="#connect" onclick="toggleMenu()">Connect</a>
    </div>

    <section class="hero">
        <div style="text-align: center;">
            <img src="images/papa-moon-logo-trans-back.png" alt="Papa Moon Logo" class="hero-logo">
            
            <div class="streaming-icons">
                <a href="https://open.spotify.com/artist/5UD1N1DPDxbImDwir2mDoE?si=zH2QCPRVScuTigjjoD1W8g" target="_blank" title="Spotify">
                    <i class="fab fa-spotify" style="color: #1DB954;"></i>
                </a>
                <a href="https://soundcloud.com/thepapamoon" target="_blank" title="SoundCloud">
                    <i class="fab fa-soundcloud" style="color: #ff8800;"></i>
                </a>
                <a href="https://youtube.com/@YOURCHANNEL" target="_blank" title="YouTube">
                    <i class="fab fa-youtube" style="color: #FF0000;"></i>
                </a>
            </div>
            
            <a href="#music" class="btn" style="margin-top: 2.5rem;">LISTEN NOW</a>
        </div>
    </section>

    <section id="music">
        <h2 class="section-title">Latest Release</h2>
        <div class="release-grid">
            <h3 id="trackTitle">Loading track...</h3>
            <p style="margin: 0.5rem 0 1.5rem; color: var(--gray); font-size: 1.1rem;">
                Papa Moon • Out Now
            </p>
            
            <iframe id="scPlayer" width="100%" height="380" scrolling="no" frameborder="no" allow="autoplay" src=""></iframe>
            
            <p style="margin-top: 2rem;">
                <a id="scLink" href="#" target="_blank" class="btn">Open on SoundCloud →</a>
            </p>
        </div>
    </section>

    <section id="videos" style="background:#111;">
        <h2 class="section-title">Videos</h2>
        <!-- Add your YouTube embeds here later -->
    </section>

    <section id="connect">
        <h2 class="section-title">Get In Touch</h2>
        <div class="contact-form">
            <form action="https://formspree.io/f/your-id-here" method="POST">
                <input type="text" name="name" placeholder="Your Name" required>
                <input type="email" name="email" placeholder="Your Email" required>
                <textarea name="message" placeholder="Your message..." required></textarea>
                <button type="submit" class="btn" style="width:100%; margin-top: 1rem;">SEND MESSAGE</button>
            </form>
        </div>
    </section>

    <footer>
        <p>&copy; 2026 Papa Moon • Australia</p>
    </footer>

    <script>
        function toggleMenu() {
            const menu = document.getElementById('mobileMenu');
            menu.classList.toggle('active');
        }

        // ==================== CHANGE ONLY THIS LINE ====================
        const soundcloudUrl = "https://soundcloud.com/thepapamoon/godless-papa-moon?si=cb7cad0ca8ab4543af7c668bcd19b3e9&utm_source=clipboard&utm_medium=text&utm_campaign=social_sharing";
        // =========================================================

        const playerUrl = `https://w.soundcloud.com/player/?url=${encodeURIComponent(soundcloudUrl)}&color=%23F57733&auto_play=false&hide_related=false&show_comments=true&show_user=true&show_reposts=false&visual=true`;

        document.getElementById("scPlayer").src = playerUrl;
        document.getElementById("scLink").href = soundcloudUrl;

        fetch(`https://soundcloud.com/oembed?url=${encodeURIComponent(soundcloudUrl)}&format=json`)
            .then(response => response.json())
            .then(data => {
                if (data.title) {
                    document.getElementById("trackTitle").textContent = data.title;
                }
            })
            .catch(err => {
                console.log("Couldn't auto-load track title", err);
                document.getElementById("trackTitle").textContent = "New Release";
            });
    </script>
</body>
</html>
